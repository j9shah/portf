<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Apple Touch Icon - Otter design with padding -->
  <rect width="180" height="180" fill="#0f0f0f"/>
  
  <g transform="translate(40, 35)">
    <defs>
      <linearGradient id="otterGradApple" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#8B7355"/>
        <stop offset="100%" style="stop-color:#6B5344"/>
      </linearGradient>
    </defs>
    
    <!-- Body/Head -->
    <ellipse cx="50" cy="55" rx="38" ry="35" fill="url(#otterGradApple)"/>
    
    <!-- Ears -->
    <circle cx="20" cy="30" r="11" fill="#6B5344"/>
    <circle cx="80" cy="30" r="11" fill="#6B5344"/>
    <circle cx="20" cy="30" r="7" fill="#D4C4B0"/>
    <circle cx="80" cy="30" r="7" fill="#D4C4B0"/>
    
    <!-- Face patch (lighter fur) -->
    <ellipse cx="50" cy="62" rx="24" ry="20" fill="#D4C4B0"/>
    
    <!-- Eyes -->
    <ellipse cx="36" cy="50" rx="7" ry="8" fill="#1a1a1a"/>
    <ellipse cx="64" cy="50" rx="7" ry="8" fill="#1a1a1a"/>
    <circle cx="38" cy="48" r="2.5" fill="#fff"/>
    <circle cx="66" cy="48" r="2.5" fill="#fff"/>
    
    <!-- Nose -->
    <ellipse cx="50" cy="64" rx="9" ry="6" fill="#1a1a1a"/>
    <ellipse cx="50" cy="63" rx="3.5" ry="2.5" fill="#4a4a4a"/>
    
    <!-- Whisker dots -->
    <circle cx="33" cy="67" r="2" fill="#8B7355"/>
    <circle cx="27" cy="71" r="2" fill="#8B7355"/>
    <circle cx="67" cy="67" r="2" fill="#8B7355"/>
    <circle cx="73" cy="71" r="2" fill="#8B7355"/>
    
    <!-- Mouth -->
    <path d="M 42 74 Q 50 80 58 74" stroke="#6B5344" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
